name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The entries here pin commits in other repositories. Nothing in this repo changes
  # when one of those moves, so check on a schedule too, otherwise drift is invisible
  # until someone happens to push.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  offline:
    name: Catalog file is well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -t .

  live:
    name: Pinned commits exist and advertise the right version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The failure this catches: a plugin repo ships version 1.4.0, nobody updates the
      # entry here, and every install keeps advertising 1.3.0 while quietly delivering
      # whatever the pinned commit holds. Nothing in either repository can see that on
      # its own, because the two halves live apart.
      - name: Each entry matches the commit it pins
        run: |
          set -euo pipefail
          fail=0
          count=$(python3 -c "import json;print(len(json.load(open('.claude-plugin/marketplace.json'))['plugins']))")

          for i in $(seq 0 $((count - 1))); do
            read -r name url sha version < <(python3 -c "
import json
p = json.load(open('.claude-plugin/marketplace.json'))['plugins'][$i]
print(p['name'], p['source']['url'], p['source']['sha'], p['version'])
")
            echo "::group::$name"
            work=$(mktemp -d)

            if ! git clone --quiet --filter=blob:none --no-checkout "$url" "$work"; then
              echo "::error::$name: cannot clone $url"
              fail=1; echo "::endgroup::"; continue
            fi
            if ! git -C "$work" cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::$name: pinned commit $sha does not exist in $url"
              fail=1; echo "::endgroup::"; continue
            fi

            actual=$(git -C "$work" show "$sha:.claude-plugin/plugin.json" 2>/dev/null \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))" || true)

            if [ -z "$actual" ]; then
              echo "::error::$name: no readable .claude-plugin/plugin.json at $sha"
              fail=1
            elif [ "$actual" != "$version" ]; then
              echo "::error::$name: catalog says $version but the pinned commit is $actual. Update the version and sha here, or re-pin."
              fail=1
            else
              echo "$name: $version matches ${sha:0:12}"
            fi
            rm -rf "$work"
            echo "::endgroup::"
          done

          exit $fail
