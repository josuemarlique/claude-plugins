name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The entries here pin commits in other repositories. Nothing in this repo changes
  # when one of those moves, so check on a schedule too, otherwise drift stays invisible
  # until someone happens to push.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  offline:
    name: Catalog file is well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -t .

  live:
    name: Pinned commits exist and advertise the right version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_pins.py
