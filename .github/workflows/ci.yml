name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The entries here pin commits in other repositories. Nothing in this repo changes
  # when one of those moves, so check on a schedule too, otherwise drift stays invisible
  # until someone happens to push.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  offline:
    name: Catalog files are well formed and aligned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -t .

  live:
    name: Pinned commits expose matching Claude and Codex plugins
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/check_pins.py
